name: Deploy to GitHub Pages

# One workflow, three triggers, and each one is load-bearing:
#   push          - ship main.
#   pull_request  - the gate has to judge PRs too, or Dependabot opens bumps
#                   with no CI signal on any of them.
#   workflow_dispatch - a merge performed with GITHUB_TOKEN raises no push
#                   event (GitHub suppresses them so workflows cannot
#                   retrigger themselves), so an auto-merged bump would land on
#                   main and the live site would keep serving the previous
#                   build with no red run anywhere to say so. The auto-merge
#                   job dispatches this workflow explicitly; a dispatch through
#                   the API is not suppressed.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A PR run must not share a group with a live main deploy. Superseded PR runs
  # can be cancelled; a main publication must be allowed to finish.
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        # Vitest 5 requires Node 22.12+ or 24+. Exercise both supported LTS
        # lines instead of accepting an install with engine warnings.
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Unit tests and KATs against the pinned NIST and drand data
        run: npm test

      - name: Build (both typechecks gate the build)
        run: npm run build

      - name: Audit locked dependencies (fail on high+)
        run: npm audit --audit-level=high

  build:
    runs-on: ubuntu-latest
    # The whole gate runs in about three minutes; GitHub's default ceiling is
    # six hours, so a hung browser would otherwise sit silently until then.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build (both typechecks gate the build)
        run: npm run build

      # NEVER --with-deps. That apt step wedged 547 CI runs across this fleet.
      - name: Install Playwright browser
        run: npx playwright install chromium

      # `playwright test` runs every spec in e2e/: the WCAG gate
      # (a11y.spec.ts) AND the claims suite (claims.spec.ts).
      - name: Accessibility gate and claims suite (Playwright)
        run: npm run test:a11y

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: dist

  configure-pages:
    if: github.event_name != 'pull_request'
    needs: [test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    steps:
      # This privileged job never checks out or executes repository code.
      - uses: actions/configure-pages@v6

  deploy:
    needs: configure-pages
    # NOT `== 'push'`. That would also skip workflow_dispatch, which is the one
    # trigger the post-auto-merge deploy depends on: the dispatched run would
    # build, pass the gate, and skip this job, so the site would still never
    # update.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  verify-deploy:
    if: github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify the published route
        env:
          PAGES_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          curl --fail --show-error --silent --location \
            --retry 10 --retry-delay 5 --retry-all-errors --max-time 15 \
            "$PAGES_URL" --output "$RUNNER_TEMP/pulse-chain.html"
          grep -F '<title>Pulse Chain — crypto-lab</title>' \
            "$RUNNER_TEMP/pulse-chain.html"

  # Dependabot only. Both deterministic tests and the full browser gate must
  # pass before a non-major bump can merge. Major updates stay open for human
  # review even when their checks are green.
  dependabot-auto-merge:
    needs: [test, build]
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      # actions: write is required by the deploy dispatch below. Without it
      # `gh workflow run` returns HTTP 403 "Resource not accessible by
      # integration", the merged bump never deploys, and a `|| echo` fallback
      # hides it.
      actions: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3

      - name: Leave major updates for human review
        if: endsWith(steps.meta.outputs.update-type, 'semver-major')
        run: echo "Major update detected; automatic merge is intentionally disabled."

      - name: Merge a non-major bump whose gate went green
        if: ${{ !endsWith(steps.meta.outputs.update-type, 'semver-major') }}
        # Retry: a sibling PR merging first moves main underneath us and GitHub
        # rejects with "Base branch was modified". That is benign, so try again
        # rather than failing the run over a race.
        run: |
          merged=""
          for attempt in 1 2 3; do
            if gh pr merge --squash --delete-branch "$PR_URL"; then
              merged=1
              break
            fi
            echo "merge attempt $attempt failed; base branch may have moved - retrying"
            sleep 15
          done
          if [ -z "$merged" ]; then
            echo "::error::gate passed but the merge did not land after 3 attempts"
            exit 1
          fi
          # A merge made with GITHUB_TOKEN raises no push event -- GitHub suppresses
          # them so workflows cannot retrigger themselves -- so deploy would never run
          # and the site would keep serving the previous build. Ask for it explicitly;
          # a workflow_dispatch through the API is not suppressed. The dispatched run
          # is the same gate-then-deploy pipeline, so a bad merge still ships nothing.
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
