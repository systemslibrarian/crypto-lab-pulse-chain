name: Live beacon drift check

# The page states dated facts from fixtures pinned on 2026-10-01. Weekly, ask
# beacon.nist.gov and api.drand.sh whether they still hold. A red run means a
# human should refresh src/fixtures/ and the prose that depends on them; it
# never blocks a deploy, because the page is honest about its capture date.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/live-check.mjs
